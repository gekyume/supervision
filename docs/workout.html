<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<title>Supervision Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Supervision's look: paper, ink, mono tags. Dark at night. */
  :root { --paper:#faf9f7; --ink:#0a0a0a; --muted:#6b6b6b; --faint:#9e9e9e; --line:rgba(0,0,0,.12); }
  @media (prefers-color-scheme: dark) { :root { --paper:#0a0a0b; --ink:#f2f2f2; --muted:#9e9e9e; --faint:#666; --line:rgba(255,255,255,.14); } }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--paper); color:var(--ink); font-family:Geist, -apple-system, system-ui, sans-serif; }
  body { display:flex; flex-direction:column; padding:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); gap:12px; }
  .tag { font:500 11px "Geist Mono", ui-monospace, monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); }
  h1 { font-weight:600; font-size:26px; line-height:1.15; }
  .stage { position:relative; flex:1; min-height:0; border-radius:16px; overflow:hidden; background:#000; }
  video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .stage.mirror video, .stage.mirror canvas { transform:scaleX(-1); }
  .count { position:absolute; left:0; right:0; bottom:14px; text-align:center; font:300 64px Geist, sans-serif; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.6); font-variant-numeric:tabular-nums; }
  .coach { font-weight:500; font-size:19px; min-height:2.4em; }
  .dots { display:flex; gap:6px; flex-wrap:wrap; }
  .dots i { width:10px; height:10px; border-radius:50%; border:1px solid var(--line); }
  .dots i.on { background:var(--ink); border-color:var(--ink); }
  button { font:500 15px Geist, sans-serif; padding:12px 18px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink); }
  button.primary { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .note { font-size:13px; color:var(--muted); }
  /* Landscape (phone on its side): camera on the left at full height, words on the right. */
  @media (orientation: landscape) and (max-height: 600px) {
    body { display:grid; grid-template-columns: 1.5fr 1fr; grid-template-rows: auto auto 1fr auto auto auto;
           column-gap:16px; row-gap:6px; padding:max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); }
    .stage { grid-column:1; grid-row:1 / -1; }
    .tag, h1, .note, .coach, .dots, .row { grid-column:2; }
    h1 { font-size:22px; } .coach { font-size:17px; } .count { font-size:56px; }
  }
</style>
</head>
<body>
  <div class="tag" id="tag">Supervision · workout</div>
  <h1 id="title">Lying-down set</h1>
  <div class="note" id="note">Prop the phone side-on to where you'll lie down, a few feet away, screen facing you. Everything happens on this phone; only the final count is sent to your Mac.</div>
  <div class="stage mirror" id="stage"><video id="v" playsinline muted></video><canvas id="c"></canvas><div class="count" id="count"></div></div>
  <div class="coach" id="coach"></div>
  <div class="dots" id="dots"></div>
  <div class="row"><button class="primary" id="go">Start</button><button id="set">Standing set</button><button id="flip">Flip camera</button><button id="promise">🤞 I promise I did it</button><button id="stop" hidden>Stop</button></div>
<script type="module">
/* Supervision workout page (Oct 26 2026). The same rules as the Mac app (Sources/Shared/Rules.swift):
   a rep = the measure crosses `enter`, then comes back past `exit`. Bridges: shoulder–hip–knee angle
   up past 158°, back below 140°. Clamshells: knee–hip–knee opening past 30°, closing below 12°.
   The Mac's private relay topic comes in the link's #fragment (never sent to this page's server).
   Query: ?b=8&c=10&p=30  (bridges, clamshells per side, pause seconds). */
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const q = new URLSearchParams(location.search);
let topic = location.hash.slice(1) || q.get("t") || "";
try { if (topic) localStorage.setItem("svTopic", topic); else topic = localStorage.getItem("svTopic") || ""; } catch {}
if (q.get("t")) { q.delete("t"); history.replaceState(null, "", location.pathname + "?" + q.toString()); }
const N = { b: +(q.get("b") || 8), c: +(q.get("c") || 10), p: +(q.get("p") || 30) };
const lying = [
  { title: "Glute bridges", kind: "bridges", target: N.b, hint: "On your back, knees bent. Lift slowly, lower slowly." },
  { title: "Clamshells · first side", kind: "clam", target: N.c, hint: "On your side, knees bent, feet together." },
  { title: "Clamshells · other side", kind: "clam", target: N.c, hint: "Roll over slowly, same again." },
  { title: "Sit up, then pause", kind: "pause", target: N.p, hint: "Sit before you stand. Let your heart rate settle." },
];
// Standing set for places without room to lie down (the office): hand on the desk, slow.
const S = +(q.get("s") || 8);
const standing = [
  { title: "Leg kickbacks · first leg", kind: "legs", target: S, hint: "Hand on the desk, side-on to the camera. Slow kick back." },
  { title: "Leg kickbacks · other leg", kind: "legs", target: S, hint: "Same, other leg." },
  { title: "Side leg raises · first leg", kind: "legs", target: S, hint: "Face the camera, hand on the desk, lift out to the side." },
  { title: "Side leg raises · other leg", kind: "legs", target: S, hint: "Same, other leg." },
];
let steps = q.get("set") === "standing" ? standing : lying;
const $ = id => document.getElementById(id);
const v = $("v"), cv = $("c"), ctx = cv.getContext("2d");
let pose, i = 0, reps = 0, armed = false, stepStart = 0, running = false, done = [], wake;
let facing = "user";   // front camera, so you can see yourself (Oct 26)
let settleUntil = 0;   // between steps: 6 s to get into position before counting (Oct 27: rolling over counted as reps)
let follow = null;     // the Mac's workout screen, when one is up (Oct 27: "always update to whatever is on my screen")

function counter(kind) { return kind === "bridges" ? { enter: 158, exit: 140 } : kind === "legs" ? { enter: 25, exit: 10 } : { enter: 30, exit: 12 }; }
function angle(a, b, c) {
  const v1 = [a[0] - b[0], a[1] - b[1]], v2 = [c[0] - b[0], c[1] - b[1]];
  const n = Math.hypot(...v1) * Math.hypot(...v2); if (!n) return 0;
  return Math.acos(Math.max(-1, Math.min(1, (v1[0] * v2[0] + v1[1] * v2[1]) / n))) * 180 / Math.PI;
}
function feed(val, kind) {               // both kinds start by rising past `enter`
  const t = counter(kind);
  if (!armed) { if (val > t.enter) armed = true; return false; }
  if (val < t.exit) {
    armed = false; reps++; navigator.vibrate?.(30);
    if (follow && topic) post(`rep|${i}|${reps}`);
    return true;
  }
  return false;
}
function render() {
  const s = steps[i];
  $("tag").textContent = `Step ${i + 1} of ${steps.length}`;
  $("title").textContent = s.title;
  $("count").textContent = s.kind === "pause" ? Math.max(0, s.target - reps) : `${Math.min(reps, s.target)} / ${s.target}`;
  $("dots").innerHTML = s.kind === "pause" ? "" : Array.from({ length: s.target }, (_, k) => `<i class="${k < reps ? "on" : ""}"></i>`).join("");
}
// The relay sometimes turns a message away (Oct 27: the 10th clamshell never arrived, and the Mac waited).
// Retry up to 5 times, 2 s apart.
async function post(body) {
  for (let k = 0; k < 5; k++) {
    try { const r = await fetch(`https://ntfy.sh/${topic}`, { method: "POST", body }); if (r.ok) return true; } catch {}
    await new Promise(res => setTimeout(res, 2000));
  }
  return false;
}
async function send(ok) {
  const summary = done.join(", ") + (ok ? "" : ` (stopped at ${steps[i].title} ${reps}/${steps[i].target})`);
  if (!topic) { $("coach").textContent = "Done, but this phone doesn't know your Mac's address yet. Open your saved Supervision link once."; return; }
  $("coach").textContent = "Sending to your Mac…";
  $("coach").textContent = await post(`workout|${ok ? "done" : "stopped"}|${summary}`)
    ? (ok ? "✓ Done. Sent to your Mac." : "Stopped. Sent to your Mac.")
    : "Couldn't reach your Mac. Check the connection, then tap 🤞 to send it.";
}
function next() {
  const s = steps[i];
  if (s.kind !== "pause") done.push(`${s.title.split(" ·")[0].toLowerCase()} ${s.target}`);
  i++; reps = 0; armed = false; stepStart = performance.now(); settleUntil = stepStart + 6000;
  if (i >= steps.length) { running = false; $("title").textContent = "✓ Nice work"; $("count").textContent = "✓"; $("stop").hidden = true; wake?.release?.(); send(true); return; }
  $("coach").textContent = steps[i].kind === steps[i - 1].kind ? "Switch sides" : steps[i].hint;
  render();
}
function loop() {
  if (!running) return;
  const s = steps[i], now = performance.now();
  if (s.kind === "pause") {
    reps = Math.floor((now - stepStart) / 1000);
    $("coach").textContent = `Sitting. ${Math.max(0, s.target - reps)} s, then stand slowly`;
    render(); if (reps >= s.target) next(); requestAnimationFrame(loop); return;
  }
  cv.width = v.videoWidth; cv.height = v.videoHeight; ctx.clearRect(0, 0, cv.width, cv.height);
  if (now < settleUntil) {
    $("coach").textContent = `Get into position · counting starts in ${Math.ceil((settleUntil - now) / 1000)}`;
    render(); requestAnimationFrame(loop); return;
  }
  const r = pose.detectForVideo(v, now), lm = r.landmarks?.[0];
  const W = v.videoWidth, H = v.videoHeight;
  const P = k => lm && lm[k] && (lm[k].visibility ?? 1) > 0.5 ? [lm[k].x * W, lm[k].y * H] : null;
  let coach = s.hint;
  if (lm) {
    ctx.fillStyle = "rgba(255,255,255,.9)";
    for (const k of [11, 12, 23, 24, 25, 26, 27, 28]) { const p = P(k); if (p) { ctx.beginPath(); ctx.arc(p[0], p[1], 6, 0, 7); ctx.fill(); } }
    if (s.kind === "bridges") {
      const side = [[11, 23, 25], [12, 24, 26]].map(t => t.map(P)).find(t => t.every(Boolean));
      if (side) { const a = angle(...side); if (feed(a, "bridges") && reps >= s.target) { next(); requestAnimationFrame(loop); return; } coach = a > 155 ? "Hold at the top… then lower slowly" : "Lift your hips, slowly"; }
      else coach = "Back up so I can see your shoulder, hip and knee";
    } else {
      const lk = P(25), rk = P(26), lh = P(23), rh = P(24);
      if (lk && rk && (lh || rh)) {
        const hip = lh && rh ? [(lh[0] + rh[0]) / 2, (lh[1] + rh[1]) / 2] : (lh || rh);
        const a = angle(lk, hip, rk); if (feed(a, s.kind === "legs" ? "legs" : "clam") && reps >= s.target) { next(); requestAnimationFrame(loop); return; }
        coach = s.kind === "legs" ? (a > 20 ? "Hold… and bring it back slowly" : "Lift the leg, slowly") : (a > 25 ? "Open… and close slowly" : "Feet together, lift the top knee");
      } else coach = "Back up so I can see your hips and both knees";
    }
  } else coach = "Lie down where the camera can see all of you";
  $("coach").textContent = coach; render();
  requestAnimationFrame(loop);
}
$("go").onclick = async () => {
  $("go").hidden = true; $("coach").textContent = "Starting the camera…";
  try {
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    pose = await PoseLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", delegate: "GPU" }, runningMode: "VIDEO", numPoses: 1 });
    await openCamera();
    wake = await navigator.wakeLock?.request("screen").catch(() => null);
    $("note").hidden = true; $("stop").hidden = false; running = true; stepStart = performance.now();
    $("coach").textContent = steps[0].hint; render(); loop();
  } catch (e) { $("go").hidden = false; $("coach").textContent = "Couldn't start the camera: " + (e.message || e); }
};
async function openCamera() {
  v.srcObject?.getTracks().forEach(t => t.stop());
  v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: 1280, height: 720 }, audio: false });
  $("stage").classList.toggle("mirror", facing === "user");
  await v.play();
}
$("flip").onclick = async () => { facing = facing === "user" ? "environment" : "user"; if (v.srcObject) await openCamera().catch(() => {}); };
$("set").onclick = () => {
  if (running) return;
  steps = steps === lying ? standing : lying; i = 0; reps = 0;
  $("set").textContent = steps === lying ? "Standing set" : "Lying-down set"; render();
};
if (steps === standing) $("set").textContent = "Lying-down set";
// Honour system for what the camera can't see: logged as "promised" on the Mac, reviewed weekly.
$("promise").onclick = () => {
  if ($("promise").disabled) return;
  $("promise").disabled = true;
  running = false; wake?.release?.();
  done = ["promised: " + steps.filter(s => s.kind !== "pause").map(s => `${s.title.split(" ·")[0].toLowerCase()} ${s.target}`).join(", ")];
  i = steps.length - 1; $("title").textContent = "✓ Counted on your word"; $("stop").hidden = true; send(true);
};
$("stop").onclick = () => { running = false; $("stop").hidden = true; wake?.release?.(); if (follow) { $("go").hidden = false; $("coach").textContent = "Paused here. Your Mac's workout is still on."; } else send(false); };

// Follow the Mac (Oct 27): the Mac publishes its workout screen to "<topic>-state"; this page shows the
// same exercise and step, and sends each rep it counts back ("rep|step|reps"). No workout up = the page's own sets.
const kindOf = k => k === "clamshells" ? "clam" : k;
function applyState(st) {
  const live = st && st.active && Date.now() / 1000 - (st.at || 0) < 1800;
  if (!live) {
    if (follow) { follow = null; running = false; wake?.release?.(); $("stop").hidden = true; $("go").hidden = false; $("set").hidden = false;
      $("title").textContent = "✓ Your Mac's workout is over"; $("count").textContent = ""; $("coach").textContent = "Nothing to follow right now."; }
    return;
  }
  const same = follow && JSON.stringify(follow.steps) === JSON.stringify(st.steps);
  follow = st;
  if (!same) { steps = st.steps.map(x => ({ ...x, kind: kindOf(x.kind) })); done = []; i = -1; }
  if (st.i !== i) { const first = i < 0; i = Math.min(st.i, steps.length - 1); reps = 0; armed = false; stepStart = performance.now(); settleUntil = first ? 0 : stepStart + 6000; if (running) $("coach").textContent = steps[i].hint; }
  if ((st.reps || 0) > reps && steps[i].kind !== "pause") reps = st.reps;
  $("set").hidden = true; $("note").hidden = running; $("note").textContent = "Following your Mac's workout. Tap Start, prop the phone where it can see you.";
  render();
}
function followMac() {
  if (!topic) return;
  fetch(`https://ntfy.sh/${topic}-state/json?poll=1&since=15m`).then(r => r.text()).then(t => {
    const last = t.trim().split("\n").filter(Boolean).map(l => JSON.parse(l)).filter(m => m.event === "message").pop();
    if (last) applyState(JSON.parse(last.message));
  }).catch(() => {});
  const es = new EventSource(`https://ntfy.sh/${topic}-state/sse`);
  es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === "message") applyState(JSON.parse(m.message)); } catch {} };
}
followMac();
render();
</script>
</body>
</html>
